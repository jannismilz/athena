name: website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

# Allow one deployment at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages must already be enabled for the repository, with the source set to
      # GitHub Actions. The `enablement` input cannot do it: it needs a token
      # with admin rights, which GITHUB_TOKEN is not. See the README.
      - uses: actions/configure-pages@v6
      # The site is a single self-contained file, so there is nothing to build.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v5
